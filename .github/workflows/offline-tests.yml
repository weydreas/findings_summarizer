name: offline-tests
on:
  push:
    branches: [main, feat/ssh-json-qwen-summary]
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight client requirements
        run: python -m pip install -r requirements.txt
      - name: Syntax checks
        run: python -m py_compile medical_summary.py tests/test_medical_summary.py
      - name: Unit tests (synthetic only, no LLM/medical data)
        run: python -m unittest discover -s tests -v
